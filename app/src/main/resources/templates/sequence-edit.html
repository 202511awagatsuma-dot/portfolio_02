<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stika | シークエンス作成</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="stika-body">
    <div class="app-shell">
        <main class="screen sequence-comp-screen">
            <header class="ios-statusbar" aria-hidden="true">
                <div class="ios-statusbar__time">13:41</div>
                <div class="ios-statusbar__notch"></div>
                <div class="ios-statusbar__icons">
                    <span class="ios-signal"><span></span><span></span><span></span><span></span></span>
                    <span class="ios-wifi"></span>
                    <span class="ios-battery">90</span>
                </div>
            </header>

            <header class="sequence-comp-header">
                <a class="sequence-comp-header__brand" th:href="@{/}" aria-label="トップへ戻る">
                    <img th:src="@{/assets/icon/img_home.svg}" src="/assets/icon/img_home.svg" alt="">
                </a>
                <h1 class="sequence-comp-header__title">シークエンス作成</h1>
                <div class="sequence-comp-header__actions">
                    <button class="sequence-comp-icon sequence-comp-icon--bell" type="button" aria-label="お知らせ"></button>
                    <button class="sequence-comp-icon sequence-comp-icon--grid" type="button" aria-label="メニュー">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </header>

            <section class="sequence-comp-summary" aria-label="初期設定サマリー">
                <div class="sequence-comp-summary__row">
                    <span class="sequence-comp-summary__time">60分</span>
                    <span class="sequence-comp-summary__level">★★★☆☆</span>
                    <span class="sequence-comp-summary__peak">アルダ チャンドラーサナ</span>
                </div>
                <div class="sequence-comp-summary__tags">
                    <button class="sequence-comp-tag" type="button">解剖学的テーマ</button>
                    <button class="sequence-comp-tag" type="button">哲学的テーマ</button>
                    <button class="sequence-comp-tag" type="button">効果・効能①</button>
                    <button class="sequence-comp-tag" type="button">効果・効能②</button>
                </div>
            </section>

            <nav class="sequence-comp-tabs" aria-label="レッスン構成タブ">
                <button class="sequence-comp-tab is-active" type="button" data-tab="all" aria-pressed="true">一覧</button>
                <button class="sequence-comp-tab" type="button" data-tab="breathing" aria-pressed="false">呼吸法</button>
                <button class="sequence-comp-tab" type="button" data-tab="warming-up" aria-pressed="false">Warming<br>UP</button>
                <button class="sequence-comp-tab" type="button" data-tab="sun-salutation" aria-pressed="false">太陽礼拝</button>
                <button class="sequence-comp-tab" type="button" data-tab="standing" aria-pressed="false">立位</button>
                <button class="sequence-comp-tab" type="button" data-tab="peak" aria-pressed="false">ピーク<br>ポーズ</button>
                <button class="sequence-comp-tab" type="button" data-tab="pose" aria-pressed="false">ポーズ</button>
                <button class="sequence-comp-tab" type="button" data-tab="seated" aria-pressed="false">座位</button>
            </nav>

            <section class="sequence-comp-sections" aria-live="polite">
                <article class="sequence-comp-section" data-category="breathing">
                    <div class="sequence-comp-section__time">5分</div>
                    <div class="sequence-comp-section__content">
                        <h2 class="sequence-comp-section__title"><span class="sequence-comp-section__dot"></span>呼吸法</h2>
                        <div class="sequence-comp-slot-list">
                            <button class="sequence-comp-slot" type="button" aria-label="呼吸法を追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                            <button class="sequence-comp-slot" type="button" aria-label="呼吸法を追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                        </div>
                        <p class="sequence-comp-section__label">おすすめ</p>
                        <p class="sequence-comp-section__recommend">完全呼吸法　カパラバティ</p>
                        <button class="sequence-comp-add" type="button">セクションを追加する</button>
                    </div>
                </article>

                <article class="sequence-comp-section" data-category="warming-up">
                    <div class="sequence-comp-section__time">10分</div>
                    <div class="sequence-comp-section__content">
                        <h2 class="sequence-comp-section__title"><span class="sequence-comp-section__dot"></span>Warming UP</h2>
                        <div class="sequence-comp-slot-list">
                            <button class="sequence-comp-slot" type="button" aria-label="Warming UPを追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                            <button class="sequence-comp-slot" type="button" aria-label="Warming UPを追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                            <button class="sequence-comp-slot" type="button" aria-label="Warming UPを追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                            <button class="sequence-comp-slot" type="button" aria-label="Warming UPを追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                        </div>
                        <p class="sequence-comp-section__label">おすすめ</p>
                        <p class="sequence-comp-section__recommend">キャット&amp;カウ　虎のポーズ</p>
                        <button class="sequence-comp-add" type="button">セクションを追加する</button>
                    </div>
                </article>

                <article class="sequence-comp-section" data-category="sun-salutation">
                    <div class="sequence-comp-section__time">10分</div>
                    <div class="sequence-comp-section__content">
                        <h2 class="sequence-comp-section__title"><span class="sequence-comp-section__dot"></span>太陽礼拝</h2>
                        <div class="sequence-comp-slot-list">
                            <button class="sequence-comp-slot" type="button" aria-label="太陽礼拝を追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                            <button class="sequence-comp-slot" type="button" aria-label="太陽礼拝を追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                        </div>
                        <p class="sequence-comp-section__label">おすすめ</p>
                        <p class="sequence-comp-section__recommend">太陽礼拝A　太陽礼拝B</p>
                        <button class="sequence-comp-add" type="button">セクションを追加する</button>
                    </div>
                </article>

                <article class="sequence-comp-section" data-category="standing">
                    <div class="sequence-comp-section__time">15分</div>
                    <div class="sequence-comp-section__content">
                        <h2 class="sequence-comp-section__title"><span class="sequence-comp-section__dot"></span>立位</h2>
                        <div class="sequence-comp-slot-list">
                            <button class="sequence-comp-slot" type="button" aria-label="立位を追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                            <button class="sequence-comp-slot" type="button" aria-label="立位を追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                            <button class="sequence-comp-slot" type="button" aria-label="立位を追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                        </div>
                        <p class="sequence-comp-section__label">おすすめ</p>
                        <p class="sequence-comp-section__recommend">戦士のポーズII　リバースウォーリア</p>
                        <button class="sequence-comp-add" type="button">セクションを追加する</button>
                    </div>
                </article>

                <article class="sequence-comp-section" data-category="peak">
                    <div class="sequence-comp-section__time">5分</div>
                    <div class="sequence-comp-section__content">
                        <h2 class="sequence-comp-section__title"><span class="sequence-comp-section__dot"></span>ピークポーズ</h2>
                        <div class="sequence-comp-slot-list">
                            <button class="sequence-comp-slot" type="button" aria-label="ピークポーズを追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                        </div>
                        <p class="sequence-comp-section__label">おすすめ</p>
                        <p class="sequence-comp-section__recommend">アルダ チャンドラーサナ</p>
                        <button class="sequence-comp-add" type="button">セクションを追加する</button>
                    </div>
                </article>

                <article class="sequence-comp-section" data-category="pose">
                    <div class="sequence-comp-section__time">10分</div>
                    <div class="sequence-comp-section__content">
                        <h2 class="sequence-comp-section__title"><span class="sequence-comp-section__dot"></span>ポーズ</h2>
                        <div class="sequence-comp-slot-list">
                            <button class="sequence-comp-slot" type="button" aria-label="ポーズを追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                            <button class="sequence-comp-slot" type="button" aria-label="ポーズを追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                        </div>
                        <p class="sequence-comp-section__label">おすすめ</p>
                        <p class="sequence-comp-section__recommend">ねじった三角のポーズ　ハーフスプリット</p>
                        <button class="sequence-comp-add" type="button">セクションを追加する</button>
                    </div>
                </article>

                <article class="sequence-comp-section" data-category="seated">
                    <div class="sequence-comp-section__time">5分</div>
                    <div class="sequence-comp-section__content">
                        <h2 class="sequence-comp-section__title"><span class="sequence-comp-section__dot"></span>座位</h2>
                        <div class="sequence-comp-slot-list">
                            <button class="sequence-comp-slot" type="button" aria-label="座位を追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                            <button class="sequence-comp-slot" type="button" aria-label="座位を追加">
                                <span class="sequence-comp-slot__plus"></span>
                            </button>
                        </div>
                        <p class="sequence-comp-section__label">おすすめ</p>
                        <p class="sequence-comp-section__recommend">ジャーヌシールシャーサナ　仰向けのツイスト</p>
                        <button class="sequence-comp-add" type="button">セクションを追加する</button>
                    </div>
                </article>
            </section>

            <p class="sequence-comp-empty" id="sequenceCompEmpty" hidden>選択中のセクションはありません。</p>

            <footer class="sequence-comp-footer">
                <div class="sequence-comp-footer__tools">
                    <button class="sequence-comp-footer__icon sequence-comp-footer__icon--undo" type="button" aria-label="戻す"></button>
                    <button class="sequence-comp-footer__icon sequence-comp-footer__icon--redo" type="button" aria-label="やり直す"></button>
                    <button class="sequence-comp-footer__circle" type="button" aria-label="操作1"></button>
                    <button class="sequence-comp-footer__circle" type="button" aria-label="操作2"></button>
                    <button class="sequence-comp-footer__circle" type="button" aria-label="操作3"></button>
                    <button class="sequence-comp-footer__circle" type="button" aria-label="操作4"></button>
                </div>
                <button class="sequence-comp-footer__book" type="button" aria-label="ブック"></button>
            </footer>
        </main>
    </div>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
