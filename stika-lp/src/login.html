<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | Stika</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <header class="auth-header">
      <a href="index.html" class="site-logo">
        <img src="img/logo.png" alt="Stika">
      </a>
    </header>

    <div class="auth-content">
      <section class="auth-signup">
        <h1 class="auth-title">ログイン</h1>
        <form class="auth-form" action="app.html" method="get">
          <div class="form-row">
            <label class="form-label" for="login-email">メールアドレス</label>
            <input id="login-email" class="form-input" type="email" name="email" placeholder="example@mmmm.nn" required>
          </div>
          <div class="form-row">
            <label class="form-label" for="login-password">パスワード</label>
            <div class="password-wrap">
              <input id="login-password" class="form-input" type="password" name="password" placeholder="＊＊＊＊" required>
              <button type="button" class="toggle-password" aria-label="パスワードを表示" aria-pressed="false"></button>
            </div>
          </div>
          <button class="btn btn-primary auth-submit" type="submit">ログイン</button>
        </form>
      </section>

      <aside class="auth-login">
        <h2 class="auth-subtitle">新規登録</h2>
        <p class="auth-login-text">はじめての方はこちら</p>
        <a href="signup.html" class="btn btn-primary auth-login-btn">新規登録へ</a>
        <a href="index.html" class="forgot-link">トップページへ戻る</a>
      </aside>
    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
