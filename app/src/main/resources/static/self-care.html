<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stika | セルフケア</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="stika-body self-care-page">
    <div class="app-shell">
        <main class="screen self-care-screen">
            <header class="topbar sequence-comp-header self-care-header">
                <a class="topbar__brand" href="/" aria-label="ホームへ戻る">
                    <img class="brand-mark" src="/assets/icon/img_home.svg" alt="">
                </a>
                <div class="self-care-header__center">
                    <h1 class="topbar__date sequence-comp-header__title">セルフケア</h1>
                </div>
                <div class="topbar__actions">
                    <span class="icon-badge icon-badge--notice" aria-hidden="true"></span>
                    <span class="icon-badge icon-badge--menu" aria-hidden="true">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </span>
                </div>
            </header>

            <section class="card self-care-card self-care-mood-card" id="selfCareMoodCard" aria-labelledby="selfCareMoodTitle">
                <div class="section-heading self-care-section-heading">
                    <h2 id="selfCareMoodTitle">今日の気分</h2>
                </div>

                <div id="selfCareMoodForm">
                    <div class="self-care-mood-options" role="radiogroup" aria-label="今日の気分">
                        <label class="self-care-mood-option">
                            <input type="radio" name="todayMood" value="good" checked>
                            <span>良い</span>
                        </label>
                        <label class="self-care-mood-option">
                            <input type="radio" name="todayMood" value="normal">
                            <span>普通</span>
                        </label>
                        <label class="self-care-mood-option">
                            <input type="radio" name="todayMood" value="tired">
                            <span>疲れ気味</span>
                        </label>
                    </div>

                    <label class="self-care-note-field" for="selfCareNote">
                        <span>メモ</span>
                        <textarea id="selfCareNote" rows="4" placeholder="今日の体調や気づきをメモ"></textarea>
                    </label>
                </div>

                <div class="self-care-mood-registered" id="selfCareMoodRegistered" hidden>
                    <div class="self-care-mood-registered__row">
                        <span class="self-care-mood-registered__label">気分</span>
                        <strong class="self-care-mood-registered__value" id="selfCareRegisteredMoodLabel">-</strong>
                    </div>
                    <div class="self-care-mood-registered__note">
                        <span class="self-care-mood-registered__label">メモ</span>
                        <p id="selfCareRegisteredMemo">-</p>
                    </div>
                    <div class="self-care-mood-actions">
                        <button class="secondary-button self-care-mood-action-button" id="selfCareEditButton" type="button">編集</button>
                        <button class="sequence-comp-delete" id="selfCareDeleteButton" type="button" aria-label="今日の気分ログを削除">
                            <svg class="sequence-comp-delete__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M9 3.75h6a1 1 0 0 1 1 1V6h3a.75.75 0 0 1 0 1.5h-1.1l-.77 11.02A2.5 2.5 0 0 1 14.64 21h-5.28a2.5 2.5 0 0 1-2.49-2.48L6.1 7.5H5a.75.75 0 0 1 0-1.5h3V4.75a1 1 0 0 1 1-1Zm5.5 2.25V5.25H9.5V6h5Zm-5.88 1.5.74 10.91a1 1 0 0 0 1 .94h5.28a1 1 0 0 0 1-.94l.74-10.91H8.62Zm2.13 2.25c.41 0 .75.34.75.75v5.5a.75.75 0 0 1-1.5 0v-5.5c0-.41.34-.75.75-.75Zm4.5 0c.41 0 .75.34.75.75v5.5a.75.75 0 0 1-1.5 0v-5.5c0-.41.34-.75.75-.75Z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <p class="self-care-mood-feedback" id="selfCareMoodFeedback" aria-live="polite"></p>
                <button class="primary-button self-care-record-button" id="selfCareRecordButton" type="button">記録する</button>

                <div class="self-care-delete-modal" id="selfCareDeleteModal" hidden>
                    <button class="self-care-delete-modal__backdrop" id="selfCareDeleteModalBackdrop" type="button" aria-label="閉じる"></button>
                    <div class="self-care-delete-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="selfCareDeleteModalTitle">
                        <h3 id="selfCareDeleteModalTitle">今日の気分ログを削除しますか？</h3>
                        <p>削除すると、今日の記録は未登録状態に戻ります。</p>
                        <div class="self-care-delete-modal__actions">
                            <button class="secondary-button self-care-delete-modal__cancel" id="selfCareDeleteCancelButton" type="button">キャンセル</button>
                            <button class="primary-button self-care-delete-modal__delete" id="selfCareDeleteConfirmButton" type="button">削除する</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="self-care-section" aria-labelledby="selfCareShortTitle">
                <div class="section-heading self-care-section-heading">
                    <h2 id="selfCareShortTitle">ショートセルフケア</h2>
                </div>
                <div class="self-care-practice-list">
                    <article class="card self-care-practice-card">
                        <div class="self-care-practice-card__content">
                            <h3>瞑想 3分</h3>
                            <p>姿勢を整えて、今の呼吸に意識を戻します。</p>
                        </div>
                        <button class="self-care-play-button" type="button" aria-label="瞑想 3分を再生">
                            <span aria-hidden="true"></span>
                        </button>
                    </article>
                    <article class="card self-care-practice-card">
                        <div class="self-care-practice-card__content">
                            <h3>呼吸ワーク 3分</h3>
                            <p>ゆっくり吸って吐くリズムをつくります。</p>
                        </div>
                        <button class="self-care-play-button" type="button" aria-label="呼吸ワーク 3分を再生">
                            <span aria-hidden="true"></span>
                        </button>
                    </article>
                </div>
            </section>

            <section class="card self-care-card self-care-reminder-card" aria-labelledby="selfCareReminderTitle">
                <div class="section-heading self-care-section-heading">
                    <h2 id="selfCareReminderTitle">リマインダー</h2>
                </div>
                <div class="self-care-reminder-row">
                    <div class="self-care-reminder-row__text">
                        <p>今日は練習</p>
                        <span>深呼吸を3分</span>
                    </div>
                    <button class="self-care-toggle is-on" type="button" role="switch" aria-checked="true" data-self-care-toggle>
                        <span class="self-care-toggle__label">ON</span>
                        <span class="self-care-toggle__knob" aria-hidden="true"></span>
                    </button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="メインナビゲーション">
            <a class="bottom-nav__item" href="/sequence-list.html">
                <img class="bottom-nav__icon" src="/assets/icon/g_sq.svg" alt="">
                <small>シークエンス</small>
            </a>
            <a class="bottom-nav__item" href="#">
                <img class="bottom-nav__icon" src="/assets/icon/g_knowlege.svg" alt="">
                <small>ナレッジ</small>
            </a>
            <a class="bottom-nav__item is-active" href="/self-care.html" aria-current="page">
                <img class="bottom-nav__icon" src="/assets/icon/g_selfcare.svg" alt="">
                <small>セルフケア</small>
            </a>
            <a class="bottom-nav__item" href="/report.html">
                <img class="bottom-nav__icon" src="/assets/icon/g_report.svg" alt="">
                <small>レポート</small>
            </a>
        </nav>
    </div>

    <script src="/js/script.js" charset="UTF-8"></script>
</body>

</html>
