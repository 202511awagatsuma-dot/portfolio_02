<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stika | シークエンス一覧</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="stika-body">
    <div class="app-shell">
        <main class="screen sequence-list-screen" id="sequenceListPage">
            <header class="topbar sequence-comp-header">
                <a class="topbar__brand" th:href="@{/}" aria-label="ホームへ戻る">
                    <img class="brand-mark" th:src="@{/assets/icon/img_home.svg}" src="/assets/icon/img_home.svg" alt="">
                </a>
                <h1 class="topbar__date sequence-comp-header__title">シークエンス一覧</h1>
                <div class="topbar__actions">
                    <span class="icon-badge icon-badge--notice" aria-hidden="true"></span>
                    <span class="icon-badge icon-badge--menu" aria-hidden="true">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </span>
                </div>
            </header>

            <div class="sequence-list-empty" id="sequenceListEmpty">
                <a class="primary-button sequence-list-empty__button" th:href="@{/sequence/setup}">シークエンスを作成する</a>
            </div>

            <section class="sequence-list" id="sequenceList" aria-live="polite" aria-label="保存済みシークエンス一覧"></section>
        </main>
    </div>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
