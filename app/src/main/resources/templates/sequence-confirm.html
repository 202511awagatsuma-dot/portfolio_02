<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stika | シークエンス確認</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="stika-body">
    <div class="app-shell">
        <main class="screen sequence-confirm-screen">
            <header class="topbar sequence-comp-header">
                <a class="topbar__brand" th:href="@{/}" aria-label="ホームへ戻る">
                    <img class="brand-mark" th:src="@{/assets/icon/img_home.svg}" src="/assets/icon/img_home.svg" alt="">
                </a>
                <h1 class="topbar__date sequence-comp-header__title">シークエンス確認</h1>
                <div class="topbar__actions">
                    <span class="icon-badge icon-badge--notice" aria-hidden="true"></span>
                    <span class="icon-badge icon-badge--menu" aria-hidden="true">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </span>
                </div>
            </header>

            <section class="sequence-comp-summary sequence-confirm-summary" aria-label="シークエンス概要">
                <div class="sequence-comp-summary__row">
                    <span class="sequence-comp-summary__time" th:text="${sequence.durationMinutes} + '分'">60分</span>
                    <span class="sequence-comp-summary__level" th:text="${levelIndicator}">★★★☆☆</span>
                    <span class="sequence-comp-summary__peak" th:text="${peakPoseLabel}">ピークポーズ未設定</span>
                </div>
                <p class="sequence-confirm-summary__text">保存前に登録内容を確認できます。Warming UP は候補選択と自由入力をまとめて同じ一覧で表示します。</p>
            </section>

            <section class="sequence-confirm-meta" aria-label="保存情報">
                <div class="sequence-confirm-meta__row">
                    <span class="sequence-confirm-meta__label">シークエンス名</span>
                    <strong class="sequence-confirm-meta__value" id="sequenceDraftTitle">シークエンス</strong>
                </div>
                <div class="sequence-confirm-meta__row">
                    <span class="sequence-confirm-meta__label">対象</span>
                    <strong class="sequence-confirm-meta__value" id="sequenceDraftTarget">未設定</strong>
                </div>
                <div class="sequence-confirm-meta__row">
                    <span class="sequence-confirm-meta__label">所要時間</span>
                    <strong class="sequence-confirm-meta__value" id="sequenceDraftDuration">60分</strong>
                </div>
                <div class="sequence-confirm-meta__row" id="sequenceDraftMemoRow" hidden>
                    <span class="sequence-confirm-meta__label">メモ</span>
                    <strong class="sequence-confirm-meta__value sequence-confirm-meta__value--multiline" id="sequenceDraftMemo"></strong>
                </div>
            </section>

            <p class="sequence-confirm-notice sequence-confirm-notice--error" id="sequenceLocalSaveNotice" hidden></p>

            <section class="sequence-confirm-list" aria-label="シークエンスの確認一覧">
                <article class="sequence-confirm-card"
                         th:each="section : ${confirmationSections}"
                         th:attr="data-category=${section.category()}">
                    <div class="sequence-confirm-card__header">
                        <span class="sequence-confirm-card__time" th:text="${section.durationLabel()}">10分</span>
                        <h2 class="sequence-confirm-card__title" th:text="${section.title()}">呼吸法</h2>
                    </div>
                    <ul class="sequence-confirm-card__items" th:if="${!#lists.isEmpty(section.asanaNames())}">
                        <li th:each="asanaName : ${section.asanaNames()}" th:text="${asanaName}">キャット＆カウ</li>
                    </ul>
                </article>
            </section>

            <p class="sequence-confirm-empty" th:if="${!hasSequenceItems}">
                まだ確認できる登録内容がありません。編集画面から項目を追加してください。
            </p>

            <section class="sequence-confirm-actions" aria-label="確認ページの操作">
                <form id="sequenceLocalSaveForm" th:action="@{/sequence/{sequenceId}/save(sequenceId=${sequenceId})}" method="post">
                    <button class="primary-button sequence-confirm-actions__primary" type="submit">保存する</button>
                </form>
                <a class="secondary-button sequence-confirm-actions__secondary"
                   th:href="${createMode} ? @{/sequence/create/edit} : @{/sequence/edit/{sequenceId}(sequenceId=${sequenceId})}">
                    編集に戻る
                </a>
            </section>
        </main>
    </div>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
