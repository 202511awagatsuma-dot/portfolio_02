<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stika | シークエンス確認</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="stika-body">
    <div class="app-shell">
        <main class="screen sequence-detail-screen" id="sequenceDetailPage">
            <header class="topbar sequence-comp-header">
                <a class="topbar__brand" th:href="@{/}" aria-label="ホームへ戻る">
                    <img class="brand-mark" th:src="@{/assets/icon/img_home.svg}" src="/assets/icon/img_home.svg" alt="">
                </a>
                <h1 class="topbar__date sequence-comp-header__title">シークエンス確認</h1>
                <div class="topbar__actions">
                    <span class="icon-badge icon-badge--notice" aria-hidden="true"></span>
                    <span class="icon-badge icon-badge--menu" aria-hidden="true">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </span>
                </div>
            </header>

            <p class="sequence-detail-notice sequence-detail-notice--error" id="sequenceDetailError" hidden></p>

            <section class="sequence-detail-content" id="sequenceDetailContent" hidden>
                <section class="sequence-confirm-meta sequence-detail-meta" aria-label="シークエンス情報">
                    <div class="sequence-confirm-meta__row">
                        <span class="sequence-confirm-meta__label">シークエンス名</span>
                        <strong class="sequence-confirm-meta__value" id="sequenceDetailTitle">-</strong>
                    </div>
                    <div class="sequence-confirm-meta__row">
                        <span class="sequence-confirm-meta__label">登録日時</span>
                        <strong class="sequence-confirm-meta__value" id="sequenceDetailDate">-</strong>
                    </div>
                    <div class="sequence-confirm-meta__row">
                        <span class="sequence-confirm-meta__label">所要時間</span>
                        <strong class="sequence-confirm-meta__value" id="sequenceDetailDuration">-</strong>
                    </div>
                    <div class="sequence-confirm-meta__row">
                        <span class="sequence-confirm-meta__label">対象</span>
                        <strong class="sequence-confirm-meta__value" id="sequenceDetailTarget">-</strong>
                    </div>
                    <div class="sequence-confirm-meta__row" id="sequenceDetailMemoRow" hidden>
                        <span class="sequence-confirm-meta__label">メモ</span>
                        <strong class="sequence-confirm-meta__value sequence-confirm-meta__value--multiline" id="sequenceDetailMemo"></strong>
                    </div>
                </section>

                <section class="sequence-detail-section-summary card" aria-label="セクション概要">
                    <div class="sequence-detail-section-summary__header">
                        <h2 class="sequence-detail-section-summary__title">セクション情報</h2>
                        <span class="sequence-detail-section-summary__count" id="sequenceDetailSectionCount">0件</span>
                    </div>
                    <p class="sequence-detail-section-summary__text" id="sequenceDetailAsanaSummary">アーサナがまだ登録されていません。</p>
                </section>

                <section class="sequence-confirm-list sequence-detail-list" id="sequenceDetailSections" aria-label="シークエンスの詳細セクション"></section>
            </section>

            <section class="sequence-detail-actions" aria-label="確認ページの操作">
                <button class="primary-button sequence-detail-actions__primary" type="button" id="sequenceDetailEditButton">編集に戻る</button>
                <a class="secondary-button sequence-detail-actions__secondary" th:href="@{/sequence-list.html}">一覧に戻る</a>
                <button class="sequence-detail-actions__delete" type="button" id="sequenceDetailDeleteButton">削除する</button>
            </section>
        </main>
    </div>

    <script th:src="@{/js/script.js}" charset="UTF-8"></script>
</body>

</html>
