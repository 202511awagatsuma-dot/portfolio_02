<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stika | ホーム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="stika-body">
    <div class="app-shell">
        <main class="screen home-screen">
            <header class="topbar">
                <a class="topbar__brand" th:href="@{/}" aria-label="ホーム">
                    <img class="brand-mark" th:src="@{/assets/icon/img_home.svg}" src="/assets/icon/img_home.svg" alt="ホーム">
                </a>
                <p class="topbar__date" th:text="${today}">2026.04.13(月)</p>
                <div class="topbar__actions">
                    <span class="icon-badge icon-badge--notice" aria-label="お知らせ"></span>
                    <span class="icon-badge icon-badge--menu" aria-label="メニュー">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </span>
                </div>
            </header>

            <section class="card message-card">
                <p class="section-eyebrow">今日のひとこと哲学</p>
                <p class="message-card__title">スティラ スッカ</p>
                <p class="message-card__text" th:text="${todayMessage}">
                    今日は少しだけでも体を動かして、自分の変化をやさしく記録してみましょう。
                </p>
            </section>

            <p class="hero-card__caption">今日はどんなシークエンスを始めますか？</p>
            <section class="hero-card">
                <a class="hero-card__link sequence-create-btn" th:href="@{/sequence/setup}">
                    <span class="hero-card__caption">今日はどんなシークエンスを始めますか？</span>
                    <strong>シークエンス作成</strong>
                    <p>その日の気分や体調に合わせて、やさしくレッスンの流れを整えられます。</p>
                </a>
            </section>

            <section class="section-block">
                <div class="section-heading">
                    <h2>ナレッジ</h2>
                </div>
                <div class="knowledge-grid">
                    <article class="round-card">
                        <a class="knowledge-link" th:href="@{/knowledge.html(category='philosophy')}" href="/knowledge.html?category=philosophy">
                            <span class="knowledge-icon">
                                <img class="knowledge-icon__image" th:src="@{/assets/icon/img01.svg}" src="/assets/icon/img01.svg" alt="">
                                <span class="knowledge-icon__label">哲学</span>
                            </span>
                        </a>
                    </article>
                    <article class="round-card">
                        <a class="knowledge-link" th:href="@{/knowledge.html(category='anatomy')}" href="/knowledge.html?category=anatomy">
                            <span class="knowledge-icon">
                                <img class="knowledge-icon__image" th:src="@{/assets/icon/img02.svg}" src="/assets/icon/img02.svg" alt="">
                                <span class="knowledge-icon__label">解剖学</span>
                            </span>
                        </a>
                    </article>
                    <article class="round-card">
                        <a class="knowledge-link" th:href="@{/knowledge.html(category='breathing')}" href="/knowledge.html?category=breathing">
                            <span class="knowledge-icon">
                                <img class="knowledge-icon__image" th:src="@{/assets/icon/img03.svg}" src="/assets/icon/img03.svg" alt="">
                                <span class="knowledge-icon__label">呼吸法</span>
                            </span>
                        </a>
                    </article>
                    <article class="round-card">
                        <a class="knowledge-link" th:href="@{/knowledge.html(category='teaching')}" href="/knowledge.html?category=teaching">
                            <span class="knowledge-icon">
                                <img class="knowledge-icon__image" th:src="@{/assets/icon/img04.svg}" src="/assets/icon/img04.svg" alt="">
                                <span class="knowledge-icon__label">指導法</span>
                            </span>
                        </a>
                    </article>
                </div>
            </section>

            <section class="section-block">
                <div class="section-heading">
                    <h2>セルフケア</h2>
                </div>
                <div class="card selfcare-card">
                    <div class="mood-row">
                        <div class="mood-item is-active">
                            <span class="mood-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="1.6"></circle>
                                    <ellipse cx="12" cy="6.3" rx="2.15" ry="3.15"></ellipse>
                                    <ellipse cx="16.9" cy="9.9" rx="2.15" ry="3.05" transform="rotate(54 16.9 9.9)"></ellipse>
                                    <ellipse cx="15.1" cy="16.2" rx="2.15" ry="3.05" transform="rotate(125 15.1 16.2)"></ellipse>
                                    <ellipse cx="8.9" cy="16.2" rx="2.15" ry="3.05" transform="rotate(-125 8.9 16.2)"></ellipse>
                                    <ellipse cx="7.1" cy="9.9" rx="2.15" ry="3.05" transform="rotate(-54 7.1 9.9)"></ellipse>
                                </svg>
                            </span>
                            <small>快調</small>
                        </div>
                        <div class="mood-item">
                            <span class="mood-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <ellipse cx="12" cy="8.2" rx="2.05" ry="3.05"></ellipse>
                                    <ellipse cx="8.6" cy="10.9" rx="2.05" ry="2.95" transform="rotate(-25 8.6 10.9)"></ellipse>
                                    <ellipse cx="15.4" cy="10.9" rx="2.05" ry="2.95" transform="rotate(25 15.4 10.9)"></ellipse>
                                    <circle cx="12" cy="12.1" r="1.35"></circle>
                                    <path d="M12 13.5v4.4"></path>
                                </svg>
                            </span>
                            <small>ふつう</small>
                        </div>
                        <div class="mood-item">
                            <span class="mood-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 6.1c2.1 1.3 3.2 3.1 3.2 5 0 1.8-1.4 3.2-3.2 3.2s-3.2-1.4-3.2-3.2c0-1.9 1.1-3.7 3.2-5Z"></path>
                                    <path d="M12 14.3v4.2"></path>
                                    <path d="M12 16.6c-1.9 0-3.2.8-4 2"></path>
                                    <path d="M12 16.6c1.9 0 3.2.8 4 2"></path>
                                </svg>
                            </span>
                            <small>ケア</small>
                        </div>
                    </div>
                    <div class="selfcare-stats">
                        <article class="play-card">
                            <div class="play-card__content">
                                <p>運動</p>
                                <strong>00分</strong>
                            </div>
                            <span class="play-card__button">▶</span>
                        </article>
                        <article class="play-card">
                            <div class="play-card__content">
                                <p>ブレスワーク</p>
                                <strong>00分</strong>
                            </div>
                            <span class="play-card__button">▶</span>
                        </article>
                    </div>
                </div>
            </section>

            <section class="section-block">
                <div class="section-heading">
                    <h2>レポート</h2>
                </div>
                <div class="card report-card calendar-card">
                    <div class="calendar-card__header">
                        <div class="calendar-nav" aria-label="月送り">
                            <button type="button" class="calendar-nav__button" data-calendar-nav="prev" aria-label="前月">◀</button>
                            <strong class="calendar-nav__label" id="calendarMonthLabel" aria-live="polite">2026年4月</strong>
                            <button type="button" class="calendar-nav__button" data-calendar-nav="next" aria-label="次月">▶</button>
                        </div>
                    </div>
                    <section class="calendar" id="growthCalendar" aria-labelledby="calendarMonthLabel">
                        <div class="calendar__weekdays" aria-hidden="true">
                            <span>日</span>
                            <span>月</span>
                            <span>火</span>
                            <span>水</span>
                            <span>木</span>
                            <span>金</span>
                            <span>土</span>
                        </div>
                        <div class="calendar__grid" id="calendarGrid" role="grid"></div>
                    </section>
                </div>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="メインナビゲーション">
            <a class="bottom-nav__item is-active" th:href="@{/sequence-list.html}">
                <img class="bottom-nav__icon" th:src="@{/assets/icon/g_sq.svg}" src="/assets/icon/g_sq.svg" alt="">
                <small>シークエンス</small>
            </a>
            <a class="bottom-nav__item" th:href="@{/knowledge.html}" href="/knowledge.html">
                <img class="bottom-nav__icon" th:src="@{/assets/icon/g_knowlege.svg}" src="/assets/icon/g_knowlege.svg" alt="">
                <small>ナレッジ</small>
            </a>
            <a class="bottom-nav__item" th:href="@{/self-care.html}" href="/self-care.html">
                <img class="bottom-nav__icon" th:src="@{/assets/icon/g_selfcare.svg}" src="/assets/icon/g_selfcare.svg" alt="">
                <small>セルフケア</small>
            </a>
            <a class="bottom-nav__item" href="report.html">
                <img class="bottom-nav__icon" th:src="@{/assets/icon/g_report.svg}" src="/assets/icon/g_report.svg" alt="">
                <small>レポート</small>
            </a>
        </nav>
    </div>

    <script th:src="@{/js/script.js}" charset="UTF-8"></script>
</body>

</html>
