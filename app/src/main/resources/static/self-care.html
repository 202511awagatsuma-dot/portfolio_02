<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stika | セルフケア</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="stika-body self-care-page">
    <div class="app-shell">
        <main class="screen self-care-screen">
            <header class="topbar sequence-comp-header self-care-header">
                <a class="topbar__brand" href="/" aria-label="ホームへ戻る">
                    <img class="brand-mark" src="/assets/icon/img_home.svg" alt="">
                </a>
                <div class="self-care-header__center">
                    <h1 class="topbar__date sequence-comp-header__title">セルフケア</h1>
                    <p>今日の状態を記録して、短いケアを始めましょう</p>
                </div>
                <div class="topbar__actions">
                    <span class="icon-badge icon-badge--notice" aria-hidden="true"></span>
                    <span class="icon-badge icon-badge--menu" aria-hidden="true">
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </span>
                </div>
            </header>

            <section class="card self-care-card self-care-mood-card" aria-labelledby="selfCareMoodTitle">
                <div class="section-heading self-care-section-heading">
                    <h2 id="selfCareMoodTitle">今日の気分</h2>
                </div>

                <div class="self-care-mood-options" role="radiogroup" aria-label="今日の気分">
                    <label class="self-care-mood-option">
                        <input type="radio" name="todayMood" value="good" checked>
                        <span>良い</span>
                    </label>
                    <label class="self-care-mood-option">
                        <input type="radio" name="todayMood" value="normal">
                        <span>普通</span>
                    </label>
                    <label class="self-care-mood-option">
                        <input type="radio" name="todayMood" value="tired">
                        <span>疲れ気味</span>
                    </label>
                </div>

                <label class="self-care-note-field" for="selfCareNote">
                    <span>メモ</span>
                    <textarea id="selfCareNote" rows="4" placeholder="今日の体調や気づきをメモ"></textarea>
                </label>

                <button class="primary-button self-care-record-button" type="button">記録する</button>
            </section>

            <section class="self-care-section" aria-labelledby="selfCareShortTitle">
                <div class="section-heading self-care-section-heading">
                    <h2 id="selfCareShortTitle">ショートセルフケア</h2>
                </div>
                <div class="self-care-practice-list">
                    <article class="card self-care-practice-card">
                        <div class="self-care-practice-card__content">
                            <h3>瞑想 3分</h3>
                            <p>姿勢を整えて、今の呼吸に意識を戻します。</p>
                        </div>
                        <button class="self-care-play-button" type="button" aria-label="瞑想 3分を再生">
                            <span aria-hidden="true"></span>
                        </button>
                    </article>
                    <article class="card self-care-practice-card">
                        <div class="self-care-practice-card__content">
                            <h3>呼吸ワーク 3分</h3>
                            <p>ゆっくり吸って吐くリズムをつくります。</p>
                        </div>
                        <button class="self-care-play-button" type="button" aria-label="呼吸ワーク 3分を再生">
                            <span aria-hidden="true"></span>
                        </button>
                    </article>
                </div>
            </section>

            <section class="card self-care-card self-care-reminder-card" aria-labelledby="selfCareReminderTitle">
                <div class="section-heading self-care-section-heading">
                    <h2 id="selfCareReminderTitle">リマインダー</h2>
                </div>
                <div class="self-care-reminder-row">
                    <div class="self-care-reminder-row__text">
                        <p>今日は練習</p>
                        <span>深呼吸を3分</span>
                    </div>
                    <button class="self-care-toggle is-on" type="button" role="switch" aria-checked="true" data-self-care-toggle>
                        <span class="self-care-toggle__label">ON</span>
                        <span class="self-care-toggle__knob" aria-hidden="true"></span>
                    </button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="メインナビゲーション">
            <a class="bottom-nav__item" href="/sequence-list.html">
                <img class="bottom-nav__icon" src="/assets/icon/g_sq.svg" alt="">
                <small>シークエンス</small>
            </a>
            <a class="bottom-nav__item" href="#">
                <img class="bottom-nav__icon" src="/assets/icon/g_knowlege.svg" alt="">
                <small>ナレッジ</small>
            </a>
            <a class="bottom-nav__item is-active" href="/self-care.html" aria-current="page">
                <img class="bottom-nav__icon" src="/assets/icon/g_selfcare.svg" alt="">
                <small>セルフケア</small>
            </a>
            <a class="bottom-nav__item" href="/report.html">
                <img class="bottom-nav__icon" src="/assets/icon/g_report.svg" alt="">
                <small>レポート</small>
            </a>
        </nav>
    </div>

    <script src="/js/script.js" charset="UTF-8"></script>
</body>

</html>
