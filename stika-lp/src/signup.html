<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 | Stika</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <header class="auth-header">
      <a href="index.html" class="site-logo">
        <img src="img/logo.png" alt="Stika">
      </a>
    </header>

    <div class="auth-content">
      <section class="auth-signup">
        <h1 class="auth-title">新規登録</h1>
        <form id="signupForm" class="auth-form" action="signup-complete.html" method="get">
          <div class="form-row">
            <label class="form-label" for="name">お名前</label>
            <input id="name" class="form-input" type="text" name="name" placeholder="山田 花子" required>
          </div>
          <div class="form-row">
            <label class="form-label" for="email">メールアドレス</label>
            <input id="email" class="form-input" type="email" name="email" placeholder="example@mmmm.nn" required>
          </div>
          <div class="form-row">
            <label class="form-label" for="password">パスワード</label>
            <div class="password-wrap">
              <input id="password" class="form-input" type="password" name="password" placeholder="＊＊＊＊" required>
              <button type="button" class="toggle-password" aria-label="パスワードを表示" aria-pressed="false"></button>
            </div>
          </div>

          <div class="auth-divider"><span>または</span></div>

          <div class="social-list">
            <button type="button" class="social-btn">
              <img src="img/icon010.png" alt="" class="social-icon">Googleで続行
            </button>
            <button type="button" class="social-btn">
              <img src="img/icon009.png" alt="" class="social-icon">Appleで続行
            </button>
            <button type="button" class="social-btn">
              <img src="img/icon011.png" alt="" class="social-icon">Lineで続行
            </button>
          </div>

          <button class="btn btn-primary auth-submit" type="submit">登録する</button>
        </form>
      </section>

      <aside class="auth-login">
        <h2 class="auth-subtitle">ログイン</h2>
        <p class="auth-login-text">アカウントをお持ちの方はこちら</p>
        <a href="#" class="btn btn-primary auth-login-btn">ログイン</a>
        <a href="#" class="forgot-link">パスワードをお忘れですか？</a>
      </aside>
    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
